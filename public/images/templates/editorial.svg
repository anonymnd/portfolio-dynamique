<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480"><rect width="720" height="480" fill="#faf5eb"/><text x="38" y="34" font-family="Georgia" font-style="italic" font-size="13" fill="#342d26">The personal edition.</text><text x="543" y="34" font-family="Arial" font-size="8" fill="#7b7063">Work　About　Contact ↗</text><path d="M38 48h644M38 52h644M38 94h644" stroke="#d7ccba"/><g font-family="Arial" font-size="7" letter-spacing="1.4" fill="#7b7063"><text x="38" y="77">A COLLECTION OF WORK &amp; IDEAS</text><text x="599" y="77">VOL. 2026</text></g><text x="37" y="186" font-family="Georgia" font-size="83" letter-spacing="-5" fill="#342d26">Mia Harper</text><path d="M38 210h644" stroke="#d7ccba"/><text x="38" y="250" font-family="Arial" font-size="7" letter-spacing="1" fill="#af4a2b">01 / INTRODUCTION</text><g font-family="Georgia" font-style="italic" font-size="27" fill="#342d26"><text x="38" y="291">A designer</text><text x="38" y="325">with a story</text><text x="38" y="359">to tell.</text></g><g fill="#7b7063" font-family="Arial" font-size="9"><text x="269" y="267">Good design starts with curiosity.</text><text x="269" y="287">I bring a thoughtful eye and an</text><text x="269" y="307">open mind to everything I make.</text><text x="269" y="345">Here is a collection of my work,</text><text x="269" y="365">ideas, and the road so far.</text></g><rect x="518" y="240" width="164" height="151" fill="#ddd5c7"/><circle cx="599" cy="284" r="24" fill="#b6a995"/><path d="M551 391q0-90 47-80 51-10 55 80" fill="#776d60"/><path d="M579 277q22-28 44 0v-15q-22-26-43-2Z" fill="#544e44"/><path d="M38 417h644" stroke="#d7ccba"/><text x="38" y="461" font-family="Georgia" font-size="29" fill="#342d26">Ideas made <tspan font-style="italic" fill="#af4a2b">real.</tspan></text><text x="599" y="455" font-family="Arial" font-size="7" letter-spacing="1" fill="#7b7063">THE WORK / 02</text></svg>
